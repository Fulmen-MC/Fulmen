[workspace]
resolver = "2"
members = [
    "crates/fulmen",
    "crates/fulmen-auth",
    "crates/fulmen-client",
    "crates/fulmen-core",
    "crates/fulmen-net",
    "crates/fulmen-protocol",
    "crates/fulmen-render",
    "crates/fulmen-world"    
]

[workspace.package]
version = "1.0.0+alpha.1"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
trim-paths = "all"